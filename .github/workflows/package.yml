# The release zip for users who don't code (epm2mod package): built once, then unpacked and started with each
# system's launcher on Linux, macOS and Windows, which makes the pinned build from OM's firmware; and the Mac disk
# image. On a pull request and on main this is a check, and nothing is published. The release workflow calls it
# (workflow_call) with the version of the release and has the disk image signed.
#
# Secrets: the Mac signing secrets are in the environment "release". Only the dmg job's signing step reads them, and
# only when the release workflow asks for it. Actions are pinned by commit; values from inputs reach the shell
# through env, never as ${{ }} in a script.
name: package

on:
  push:
    branches: [main]
    paths: ['cli/src/**', 'release/**', 'web/**', 'data/builds/**', 'data/specs/**', 'epm2mod.json', 'data/pinned-build.json', 'data/films/film-records.json', '.github/workflows/package.yml', '.github/scripts/release_smoke.py']
  pull_request:
    paths: ['cli/src/**', 'release/**', 'web/**', 'data/builds/**', 'data/specs/**', 'epm2mod.json', 'data/pinned-build.json', 'data/films/film-records.json', '.github/workflows/package.yml', '.github/scripts/release_smoke.py']
  workflow_call:
    inputs:
      release_version:
        description: The version of the release, like 2026.11.19-rc.1. Empty for a check, which uses the commit's date and -dev.
        type: string
        default: ''
      sign:
        description: Sign the Mac disk image with the Developer ID certificate and have Apple notarize it.
        type: boolean
        default: false
    outputs:
      name:
        description: The name of the zip without .zip
        value: ${{ jobs.build.outputs.name }}
      sha256:
        description: The sha256 of the firmware that the zip makes
        value: ${{ jobs.build.outputs.sha256 }}

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.zip.outputs.name }}
      sha256: ${{ steps.zip.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # no cache: a cache that another run wrote could change what a release signs and publishes
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      # no install scripts: a dependency can not run code at install time (none needs one)
      - run: npm ci --ignore-scripts && npm run build:app
        working-directory: web
      - id: zip
        env:
          PYTHONPATH: cli/src
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          # the release's version, or for a check the date of the commit with -dev: the same commit gives the same name
          version="${RELEASE_VERSION:-$(git show -s --format=%cd --date=format:%Y.%m.%d HEAD)-dev}"
          # a release holds the pinned build with the day of the release as its label: that needs Olympus's firmware,
          # downloaded from Olympus for this run
          python -m epm2mod fetch-stock
          python -m epm2mod package --out-dir dist --release-version "$version"
          name=$(basename dist/*.zip .zip)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha256=$(python -c 'import sys; from epm2mod.release import release_description; from epm2mod.paths import repo_paths; print(release_description(repo_paths(), sys.argv[1]).sha256)' "$version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip
          path: dist/*.zip
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      NAME: ${{ needs.build.outputs.name }}
      SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12' # runs the smoke script only; setup-python has no 3.12.16 for macOS and Windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
          path: zip
      # unpack as each system's own tool does
      - if: runner.os == 'Linux'
        run: unzip -q "zip/$NAME.zip" -d unpacked
      - if: runner.os == 'macOS'
        run: ditto -x -k "zip/$NAME.zip" unpacked
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -LiteralPath "zip/$env:NAME.zip" -DestinationPath unpacked
      # bash on Windows too: in PowerShell, $NAME is not the environment variable
      - shell: bash
        run: python .github/scripts/release_smoke.py "unpacked/$NAME" "$SHA256"

  # The Mac download: the zip's folder in EPM2Mod.app, in a disk image (release/mac/make-dmg.sh). For a release it is
  # signed with the Developer ID certificate and Apple notarizes it, so it opens without Open Anyway; a check signs
  # it ad hoc.
  dmg:
    needs: build
    runs-on: macos-15
    # the signing secrets: for a release only. The environment only restricts which branches and tags may use them
    environment: ${{ inputs.sign && 'release' || '' }}
    env:
      NAME: ${{ needs.build.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: release/mac
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
          path: zip
      - if: inputs.sign
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          # Apple's Developer ID G2 intermediate certificate (https://www.apple.com/certificateauthority/)
          CA_SHA256: f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a
        # a keychain for this run only, as the default one, so that codesign and notarytool find the certificate and
        # the notarization login (profile epm2mod); deleted before anything from the zip runs
        run: |
          KC="$RUNNER_TEMP/sign.keychain-db"
          KCPASS=$(openssl rand -hex 16)
          echo "::add-mask::$KCPASS"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security default-keychain -s "$KC"
          security list-keychains -d user -s "$KC"
          curl -fsSL -o "$RUNNER_TEMP/ca.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "$CA_SHA256  $RUNNER_TEMP/ca.cer" | shasum -a 256 -c -
          security import "$RUNNER_TEMP/ca.cer" -k "$KC"
          printf %s "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" > /dev/null
          xcrun notarytool store-credentials epm2mod --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "EPM2MOD_SIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"
          echo "EPM2MOD_NOTARY_PROFILE=epm2mod" >> "$GITHUB_ENV"
      # make-dmg.sh copies the zip's files into the app and signs it; it runs none of them
      - name: Make the disk image; for a release sign it and wait for Apple's notarization (at most 45 minutes)
        timeout-minutes: 45 # Apple's service can hang (6 hours on 2026-11-25); the normal time is a few minutes
        run: release/mac/make-dmg.sh "zip/$NAME.zip" dist
      - if: always() && inputs.sign
        run: security delete-keychain "$RUNNER_TEMP/sign.keychain-db" || true
      # the app's start, from the disk image (the keychain is gone): copy to Application Support, uv, Python, --version
      - run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" dist/*.dmg
          "$RUNNER_TEMP/dmg/EPM2Mod.app/Contents/Resources/launch.sh" --version \
            || { cat "$HOME/Library/Application Support/EPM2Mod/start.log"; exit 1; }
          cat "$HOME/Library/Application Support/EPM2Mod/start.log"
          hdiutil detach "$RUNNER_TEMP/dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dmg
          path: dist/*.dmg
          if-no-files-found: error
