# The hard checks of the package, the scripts, the documents, the generators and the builds: tools/ci.sh python,
# the script a contributor runs. It makes the pinned build and each build description that the change touches,
# and starts them in the emulator. Olympus's firmware is downloaded from Olympus in each run and is never stored.
name: python

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tools/ci.sh compares with the base commit
      # the title becomes the commit subject of a squash merge: the commit-msg hook's rule
      - if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title" && .githooks/commit-msg "$RUNNER_TEMP/title"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # the version that release/start.sh pins
      - run: python -m pip install --quiet uv==0.13.6
      - run: uv sync --locked
      - id: binutils
        run: echo "commit=$(git rev-parse HEAD:third_party/binutils-gdb)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/toolchain
          key: mn103-binutils-${{ steps.binutils.outputs.commit }}
      - run: sudo apt-get install -y --no-install-recommends bison flex texinfo
      # binutils, the emulator submodule, Olympus's firmware, the firmware map
      - run: uv run epm2mod init
      - run: uv run epm2mod init --check
      - env:
          # a pull request: its base branch. A push to main: the commit before it
          CI_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: tools/ci.sh python
