# The film-looks web app (web/): checks on every change, and the GitHub Pages site from main.
name: web

on:
  push:
    branches: [main]
    paths: ['web/**', 'data/films/film-records.json', '.github/workflows/web.yml', '.nvmrc', 'tools/ci.sh', 'tools/node.sh']
  pull_request:
    paths: ['web/**', 'data/films/film-records.json', '.github/workflows/web.yml', '.nvmrc', 'tools/ci.sh', 'tools/node.sh']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # the script a contributor runs: npm ci without install scripts, check, the browser, e2e
      - run: tools/ci.sh web
        working-directory: .
        env:
          PLAYWRIGHT_INSTALL: --with-deps
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: web/apps/site/dist

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
