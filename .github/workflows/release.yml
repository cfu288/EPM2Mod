# This workflow checks, makes and publishes a release. A person starts it by hand from main. See docs/dev/conventions.md,
# section "Releases".
name: release

on:
  workflow_dispatch:
    inputs:
      kind:
        description: An rc release is a test release (a pre-release). A final release is for everyone.
        type: choice
        options: [rc, final]
        default: rc
      build:
        description: For a test release of a build that is not pinned, give its name. Leave it empty for the pinned build.
        type: string
        default: ''
      summary:
        description: Describe what is new in this release in plain sentences for users. The text appears under the title.
        type: string
        default: ''
      dry_run:
        description: Do everything except create the tag and publish the release.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      release_version: ${{ steps.plan.outputs.release_version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      commit: ${{ steps.plan.outputs.commit }}
      sha256: ${{ steps.plan.outputs.sha256 }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # The plan needs the tags and the commits since the last release.
      - name: Set up Python, Node and uv
        uses: ./.github/actions/setup
      - name: Set up the clone
        run: uv run epm2mod init
      - name: Run the checks
        env:
          CI_BASE: ${{ github.sha }} # Nothing has changed since the base, so the checks make the pinned build only.
          PLAYWRIGHT_INSTALL: --with-deps
        run: tools/ci.sh
      - name: Plan the release
        id: plan
        env:
          KIND: ${{ inputs.kind }}
          BUILD: ${{ inputs.build }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          args=(--json --summary "$SUMMARY")
          if [ "$KIND" = final ]; then args+=(--final); fi
          if [ -n "$BUILD" ]; then args+=(--build "$BUILD"); fi
          status=0
          uv run epm2mod release "${args[@]}" > plan.json || status=$?
          jq -r '(.problems[]? | "::error::Not ready: \(.)"), (.error.message? // empty | "::error::\(.)")' plan.json
          [ "$status" -eq 0 ] || exit "$status"
          jq -r '"tag=\(.tag)", "release_version=\(.release_version)", "prerelease=\(.prerelease)",
            "commit=\(.commit)", "sha256=\(.sha256)"' plan.json >> "$GITHUB_OUTPUT"
          jq -r .notes plan.json | tee notes.md
      - name: Upload the notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  package:
    needs: plan
    uses: ./.github/workflows/package.yml
    with:
      release_version: ${{ needs.plan.outputs.release_version }}
      sign: true

  publish:
    needs: [plan, package]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # The job creates the tag and the GitHub release.
    steps:
      - name: Download the zip, the disk image and the notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.release_version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          CHECKED: ${{ needs.plan.outputs.sha256 }}
          PACKAGED: ${{ needs.package.outputs.sha256 }}
        # A draft creates no tag, so a failed upload leaves only a draft. Publishing the draft creates the tag.
        # A draft that a failed run left is deleted first. A published release with the tag stops the step.
        run: |
          if [ -z "$CHECKED" ] || [ "$CHECKED" != "$PACKAGED" ]; then
            echo "::error::The zip installs the firmware $PACKAGED, but the plan checked $CHECKED."
            exit 1
          fi
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> "$RUNNER_TEMP/view.err"); then
            if [ "$draft" != true ]; then
              echo "::error::The release $TAG is already published."
              exit 1
            fi
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          elif ! grep -q 'release not found' "$RUNNER_TEMP/view.err"; then
            cat "$RUNNER_TEMP/view.err" >&2
            exit 1
          fi
          gh release create "$TAG" release-zip/*.zip release-dmg/*.dmg --draft --prerelease="$PRERELEASE" \
            --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --title "EPM2Mod $VERSION" \
            --notes-file release-notes/notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
