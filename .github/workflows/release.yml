# The release zip for users who don't code (epm2mod package; a tag from epm2mod release publishes it): built once, then unpacked and started with each
# system's launcher on Linux, macOS and Windows, which makes the pinned build from OM's firmware. A tag v* also
# publishes the zip as a GitHub release.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['src/**', 'release/**', 'web/**', 'builds/**', 'patches/**', 'pinned-build.json', 'looks/film-records.json', '.github/workflows/release.yml', '.github/scripts/release_smoke.py']
  pull_request:
    paths: ['src/**', 'release/**', 'web/**', 'builds/**', 'patches/**', 'pinned-build.json', 'looks/film-records.json', '.github/workflows/release.yml', '.github/scripts/release_smoke.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.zip.outputs.name }}
      sha256: ${{ steps.zip.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci && npm run build:app
        working-directory: web
      - id: zip
        env:
          PYTHONPATH: src
        run: |
          # calendar version: the tag without its v (v2026.11.18-rc.1), or today's date with -dev on a branch
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
            *) version="$(date -u +%Y.%m.%d)-dev" ;;
          esac
          python -m epm2mod package --out-dir dist --release-version "$version"
          name=$(basename dist/*.zip .zip)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha256=$(python -c 'from epm2mod.builds import pinned_description; from epm2mod.paths import repo_paths; print(pinned_description(repo_paths()).sha256)')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-zip
          path: dist/*.zip
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: release-zip
          path: zip
      # unpack as each system's own tool does
      - if: runner.os == 'Linux'
        run: unzip -q "zip/${{ needs.build.outputs.name }}.zip" -d unpacked
      - if: runner.os == 'macOS'
        run: ditto -x -k "zip/${{ needs.build.outputs.name }}.zip" unpacked
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Expand-Archive -LiteralPath "zip/${{ needs.build.outputs.name }}.zip" -DestinationPath unpacked
      - run: python .github/scripts/release_smoke.py "unpacked/${{ needs.build.outputs.name }}" "${{ needs.build.outputs.sha256 }}"

  publish:
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: release
      - uses: actions/download-artifact@v8
        with:
          name: release-zip
          path: zip
      - env:
          GH_TOKEN: ${{ github.token }}
        # a tag with a hyphen (v2026.11.18-rc.1) is a pre-release: for testing, not yet for everyone
        run: |
          # the notes that epm2mod release wrote into the annotated tag (what is in it, what changed), then how to install
          ref=$(gh api "repos/${{ github.repository }}/git/ref/tags/${{ github.ref_name }}" --jq '.object.type + " " + .object.sha')
          case "$ref" in tag\ *) gh api "repos/${{ github.repository }}/git/tags/${ref#tag }" --jq .message > tagnotes.md ;; *) : > tagnotes.md ;; esac
          if grep -q '^EPM2Mod ' tagnotes.md; then
            { cat tagnotes.md; echo; cat release/NOTES.md; } > notes.md
          else
            { cat release/NOTES.md; echo; echo "Firmware sha256 \`${{ needs.build.outputs.sha256 }}\`."; } > notes.md
          fi
          pre=""
          case "${{ github.ref_name }}" in *-*) pre="--prerelease" ;; esac
          gh release create "${{ github.ref_name }}" zip/*.zip $pre --repo "${{ github.repository }}" \
            --title "EPM2Mod ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
