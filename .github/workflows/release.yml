# This workflow checks a release, makes its installer and publishes it when a person starts it by hand from main.
name: Release

on:
  workflow_dispatch:
    inputs:
      kind:
        description: An rc release is a test release (a pre-release). A final release is for everyone.
        type: choice
        options: [rc, final]
        default: rc
      build:
        description: For a test release of a build that is not pinned, give its name. Leave it empty for the pinned build.
        type: string
        default: ''
      summary:
        description: Describe what is new in this release in plain sentences for users. The text appears under the title.
        type: string
        default: ''
      dry_run:
        description: Do everything except create the tag and publish the release.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      release_version: ${{ steps.plan.outputs.release_version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      commit: ${{ steps.plan.outputs.commit }}
      sha256: ${{ steps.plan.outputs.sha256 }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # The plan needs the tags and the commits since the last release.
      - name: Set up the tools
        uses: ./.github/actions/setup
      - name: Set up the clone
        run: uv run epm2mod init
      - name: Run the checks
        env:
          CI_BASE: ${{ github.sha }} # Nothing has changed since the base, so the checks make the pinned build only.
          PLAYWRIGHT_INSTALL: --with-deps
        run: tools/ci.sh
      - name: Plan the release
        id: plan
        env:
          KIND: ${{ inputs.kind }}
          BUILD: ${{ inputs.build }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          args=(--json --summary "$SUMMARY")
          if [ "$KIND" = final ]; then args+=(--final); fi
          if [ -n "$BUILD" ]; then args+=(--build "$BUILD"); fi
          status=0
          uv run epm2mod release "${args[@]}" > plan.json || status=$?
          jq -r '(.problems[]? | "::error::Not ready: \(.)"), (.error.message? // empty | "::error::\(.)")' plan.json
          [ "$status" -eq 0 ] || exit "$status"
          jq -r '"tag=\(.tag)", "release_version=\(.release_version)", "prerelease=\(.prerelease)",
            "commit=\(.commit)", "sha256=\(.sha256)"' plan.json >> "$GITHUB_OUTPUT"
          jq -r .notes plan.json | tee notes.md
      - name: Upload the notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  package:
    name: Make the installer
    needs: plan
    uses: ./.github/workflows/installer.yml
    with:
      release_version: ${{ needs.plan.outputs.release_version }}
      sign: true

  publish:
    name: Publish the release
    needs: [plan, package]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # The job creates the tag and the GitHub release.
    steps:
      - name: Check out the publish script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: release
          persist-credentials: false
      - name: Download the zip, the disk image and the notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.release_version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          CHECKED: ${{ needs.plan.outputs.sha256 }}
          PACKAGED: ${{ needs.package.outputs.sha256 }}
        run: release/publish.sh "$TAG" "$VERSION" "$PRERELEASE" "$COMMIT" "$CHECKED" "$PACKAGED"
