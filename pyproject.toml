[project]
name = "epm2mod"
dynamic = ["version"]
description = "Build and check custom firmware for the Olympus PEN E-PM2"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Needed only to regenerate the film-look patch specs from the fit files.
looks = ["numpy>=1.24"]

[project.scripts]
epm2mod = "epm2mod.cli:main"

[dependency-groups]
dev = ["black>=24", "mypy>=1.10", "numpy>=1.24"]
# What the scripts under experiments/ import. Not needed to build firmware.
research = [
    "numpy>=1.24",
    "scipy",
    "numba",
    "pillow",
    "rawpy",
    "matplotlib",
    "pyflakes",
    "opencv-python-headless",
    "spektrafilm @ git+https://github.com/andreavolpato/spektrafilm@3bb2c2d ; python_version >= '3.13'",
]

[tool.uv]
# `uv sync` and `uv run` keep both groups installed, so the research scripts and the
# package share one environment (.venv).
default-groups = ["dev", "research"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/epm2mod/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/epm2mod"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/epm2mod", "tests/support.py", "tests/test_package.py", "tests/test_looks.py", "tests/test_eventlog.py"]
mypy_path = ["src", "tests"]
