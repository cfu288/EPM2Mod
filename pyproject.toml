# The workspace: one environment (.venv) for the epm2mod package (cli/) and the research scripts
# (experiments/, tools/, gen/). `uv sync` installs the package from cli/ and both groups.
[project]
name = "epm2-tools"
version = "0"
requires-python = ">=3.10"
dependencies = ["epm2mod"]

[dependency-groups]
dev = ["black>=24", "mypy>=1.10", "numpy>=1.24"]
# What the scripts under experiments/ import. Not needed to build firmware.
research = [
    "numpy>=1.24",
    "scipy",
    "numba",
    "pillow",
    "rawpy",
    "matplotlib",
    "pyflakes",
    "opencv-python-headless",
    "spektrafilm @ git+https://github.com/andreavolpato/spektrafilm@3bb2c2d ; python_version >= '3.13'",
]


[tool.uv]
package = false
# `uv sync` and `uv run` keep both groups installed, so the research scripts and the
# package share one environment (.venv).
default-groups = ["dev", "research"]

[tool.uv.sources]
epm2mod = { workspace = true }

[tool.uv.workspace]
members = ["cli"]
