# The workspace: one environment (.venv) for the epm2mod package (cli/) and the scripts (tools/, gen/, emulator/,
# experiments/). `uv sync` installs the package from cli/ and the dev group.
[project]
name = "epm2-tools"
version = "0"
requires-python = ">=3.10"
dependencies = ["epm2mod"]

[dependency-groups]
dev = ["black>=24", "mypy>=1.10", "numpy>=1.24", "pillow"]
# What the scripts under experiments/ import: `uv sync --group research`. Not needed to build or check firmware.
research = [
    "numpy>=1.24",
    "scipy",
    "numba",
    "pillow",
    "rawpy",
    "matplotlib",
    "pyflakes",
    "opencv-python-headless",
    "spektrafilm @ git+https://github.com/andreavolpato/spektrafilm@3bb2c2d ; python_version >= '3.13'",
]


[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.sources]
epm2mod = { workspace = true }

[tool.uv.workspace]
members = ["cli"]
