[project]
name = "epm2mod"
dynamic = ["version"]
description = "Build and check custom firmware for the Olympus PEN E-PM2"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Needed only to regenerate the film-look patch specs from the fit files.
looks = ["numpy>=1.24"]

[project.scripts]
epm2mod = "epm2mod.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/epm2mod/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/epm2mod"]

[tool.black]
line-length = 88
target-version = ["py310"]
# black formats the package and these two test files. The other test files keep their own line length.
# Run it as CI and the commit hook do: uv run --directory cli black .
force-exclude = '^/tests/(?!support\.py$|test_package\.py$)'

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/epm2mod", "tests/support.py", "tests/test_package.py", "tests/test_eventlog.py"]
mypy_path = ["src", "tests"]
