<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>E-PM2 film looks</title>
    <script>
      // GitHub Pages serves this file for every unknown path. Redirect to the app with the path in the query
      // (index.html puts it back). One path segment (/EPM2Mod/) is the site's base.
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
