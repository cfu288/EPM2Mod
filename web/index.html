<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Choose which film looks appear in the ART menu of an Olympus PEN E-PM2 with the EPM2Mod firmware, and download the file for the SD card."
    />
    <title>Film looks for the Olympus PEN E-PM2</title>
    <script>
      // GitHub Pages SPA redirect (public/404.html sends unknown paths here as ?/path&query): put the path back.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body class="h-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
